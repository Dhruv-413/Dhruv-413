name: Refresh profile graphics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_PAT }}

      - name: Render cards
        run: python3 scripts/render_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT }}
          GITHUB_USER: Dhruv-413
          OUT_DIR: assets

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg assets/activity.svg assets/languages.svg \
                  assets/stats.svg assets/stack.svg assets/footer.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile graphics"
          git push
