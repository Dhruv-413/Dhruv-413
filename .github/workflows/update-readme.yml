name: Refresh profile README

on:
  schedule:
    # Every six hours, on the hour. 02:00 UTC == 07:30 IST, so the first
    # run of the day lands before the day starts.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "scripts/**"
      - "content/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs first and needs no token. A malformed SVG shows up on the
      # profile as a broken image with no error anywhere, so it is worth
      # failing the build before anything is written.
      - name: Self-test every card in both themes
        run: python scripts/selftest.py

      # Deterministic and data-free, but regenerated so a palette change
      # in lib/theme.py reaches the header without a manual step.
      - name: Draw the hero banner
        run: python scripts/build_banner.py

      # Colours are this repository's own contribution ramp from
      # lib/theme.py, so the snake matches the heatmap above it rather
      # than arriving in a stranger's palette.
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#0E9F76&color_dots=#EBEEF6,#C9CDF7,#9AA0F0,#6A6FE4,#4338CA
            assets/snake-dark.svg?color_snake=#3ED6A6&color_dots=#161A26,#26306E,#3D48B4,#5D67E4,#949AFF

      - name: Build README sections and cards from the GraphQL API
        env:
          # GITHUB_TOKEN covers public data. GH_PAT (read:user + repo) also
          # counts private contributions.
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          # Empty serves the committed cards. Set this to the deployed
          # endpoint to switch the README over to live rendering.
          LIVE_BASE: ${{ vars.LIVE_BASE }}
        run: python scripts/build_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
