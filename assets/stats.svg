<svg width="592" height="300" viewBox="0 0 592 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="profile statistics"><defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="1" stroke-opacity="0.10" />
    </pattern>
    <style>
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes glow { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .ln path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s ease-out forwards; }
      .pk { opacity: 0; animation: glow 3.4s ease-in-out infinite; }
      .tx { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.3,1) forwards; }
      .bar { transform-origin: left center; animation: wipe 0.9s cubic-bezier(.2,.7,.3,1) forwards; }
    </style>
    
  </defs><rect width="592" height="300" rx="14" fill="#141824" />
  <rect width="592" height="300" filter="url(#grain)" opacity="0.05" />
  <text x="22" y="30" fill="#8b93b0" font-size="11.5" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" letter-spacing="2.4">SURVEY MARKERS &#183; 12 MONTHS</text><text x="570" y="30" fill="#5a6280" font-size="11" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" text-anchor="end">@Dhruv-413</text>
  <line x1="22" y1="44" x2="570" y2="44" stroke="#252a3a" stroke-width="1" />
